spring:
  profiles:
    active: dev

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8001

---
spring:
  config.activate.on-profile: dev
  data:
    mongodb:
      uri: mongodb://gendercomics_api_dev:test123@localhost:27017/gendercomics-dev?authSource=admin&authMechanism=SCRAM-SHA-1
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:81/realms/gendercomics

images:
  path: /Users/michael.litschauer/projects/gendercomics/images/

logging:
  level:
    root: INFO
    net.gendercomics: DEBUG

---

spring:
  config.activate.on-profile: stage
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/gendercomics-dev?authSource=admin&authMechanism=SCRAM-SHA-1
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://sso.gendercomics.net/realms/gendercomics

images:
  path: /images/

logging:
  level:
    root: INFO
    net.gendercomics: DEBUG

---

spring:
  config.activate.on-profile: production
  devtools:
    add-properties: false
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/gendercomics?authSource=admin&authMechanism=SCRAM-SHA-1
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://sso.gendercomics.net/realms/gendercomics

images:
  path: /images/
